<nav class="max-w-7xl mx-auto mb-10">
        <div class="p-3 flex items-center justify-between">
          
          <!-- Left: Brand & Source Pill -->
          <div class="flex items-center gap-6">
            <div (click)="selectTab('portfolio')" class="flex items-center gap-3 cursor-pointer group">
              <div class="w-11 h-11 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/20 transition-all group-hover:rotate-6 group-hover:scale-110">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-11.7 8.38 8.38 0 0 1 3.8.9L21 3l-1.6 4.5L21 11.5Z"/></svg>
              </div>
              <div class="flex flex-col">
                <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">
                  MANA<span class="text-indigo-400">WATCH</span>
                </h1>
              </div>
            </div>

            <!-- Integrated Source Badge -->
            <div class="hidden lg:flex items-center gap-2 bg-black/40 border border-white/5 py-1.5 px-3 rounded-full border border-white/10">
              <span class="text-[9px] font-bold uppercase tracking-widest text-slate-500 bg-white/5">
                Powered by Scryfall
              </span>
            </div>
          </div>

          <!-- Right: Session & Global Metrics -->
          <div class="flex items-center gap-3 md:gap-6">
            
            <!-- Dynamic Stats (Hidden on Mobile) -->
            <div class="hidden sm:flex flex-col items-end border-r border-white/10 pr-6">
              <span class="text-[9px] font-bold text-slate-500 uppercase tracking-[0.2em]">Portfolio</span>
              <span class="text-lg font-black text-emerald-400 font-mono tracking-tighter">
                $ {{ watchlistValue() | number:'1.2-2' }}
              </span>
            </div>

            <!-- Auth/Profile Module -->
            <div class="flex items-center gap-2">
              @if (user()) {
                <div class="flex items-center gap-3 bg-white/5 p-1 rounded-2xl border border-white/5 hover:bg-white/10 transition-colors">
                  <div class="hidden md:block px-2">
                    <p class="text-[11px] font-bold text-slate-100 truncate max-w-[80px]">
                      {{ user() || 'user5432543' }}
                    </p>
                  </div>
                  <button (click)="handleLogout()" class="p-2 text-slate-500 hover:text-red-400 transition-colors cursor-pointer" title="Logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                  </button>
                </div>
              } @else {
                <button (click)="handleLogin()" class="group flex items-center gap-2 px-5 py-2.5 bg-white text-black rounded-2xl text-[11px] font-black uppercase tracking-wider hover:bg-indigo-500 hover:text-white transition-all active:scale-95 shadow-lg shadow-white/5">
                  Sign In
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="transition-transform group-hover:translate-x-0.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                </button>
              }
            </div>
          </div>
        </div>
      </nav>
