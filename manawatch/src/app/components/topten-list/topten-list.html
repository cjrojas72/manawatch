<div class="bg-[#16161a] border border-white/5 rounded-3xl shadow-xl overflow-hidden flex flex-col">
    <div class="p-6 border-b border-white/5 bg-white/[0.02]">
        <h2 class="text-xs font-black uppercase tracking-[0.3em] text-amber-500 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
            Market Staples (All-Time)
        </h2>
    </div>
    <div class="p-4 space-y-2">
    @for (card of marketHighs(); track card.id) {
        <div class="flex items-center gap-4 p-3 hover:bg-white/5 rounded-xl transition-all cursor-pointer group">
            <img [src]="card.image_uris?.small" class="w-12 h-16 object-contain rounded shadow" alt="">
            <div class="flex-grow min-w-0">
            <h4 class="text-sm font-bold text-slate-200 group-hover:text-indigo-400 truncate transition-colors">{{ card.name }}</h4>
                 <div class="flex items-center gap-2 mt-1">
                    <span class="text-[9px] text-slate-500 font-bold uppercase truncate">{{ card.set_name }}</span>
                    <span class="text-[8px] px-1 bg-white/5 rounded text-slate-600 uppercase">{{ card.rarity }}</span>
                    @if(card.foil){
                        <span class="text-[8px] px-1 bg-white/5 rounded text-slate-600 uppercase">Foil</span>
                    }
                </div>
            </div>
                <span class="text-xs font-mono font-bold text-amber-500 shrink-0">$ 
                    @if(card.foil){ 
                        {{ card.prices?.usd_foil }}
                    } @else{
                        {{ card.prices?.usd }}
                    }
                </span>
        </div>
    }
    </div>
    <div class="mt-auto p-4 border-t border-white/5 bg-black/20 text-center">
        <p class="text-[9px] text-slate-600 font-bold uppercase tracking-widest italic mb-0">
            Market data based on (TCGPlayer Avg.)
        </p>
    </div>
</div>
