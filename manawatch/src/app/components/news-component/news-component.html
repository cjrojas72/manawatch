<div class="bg-[#16161a] border border-white/5 rounded-3xl shadow-xl overflow-hidden flex flex-col">
    <div class="p-6 border-b border-white/5 bg-white/[0.02] flex justify-between items-center">
        <h2 class="text-xs font-black uppercase tracking-[0.3em] text-emerald-500 flex items-center gap-2">
            <i class="fa-regular fa-newspaper"></i>
            Market News & Articles
        </h2>
    </div>
    <div class="p-8">
        <div 
            class="grid grid-cols-1 md:grid-cols-2 gap-8 overflow-y-auto max-h-[900px] custom-scrollbar pr-4"
            [class.animate-pulse]="isLoading()"
        >
            @for (news of newsFeed(); track news.link) {
                <a [href]="news.link" target="_blank" class="flex flex-col p-7 bg-white/[0.02] hover:bg-white/5 rounded-3xl border border-white/5 transition-all group relative">
                    <div class="absolute top-6 right-7 text-[10px] font-black text-slate-600 uppercase tracking-wider">
                        {{ news.pubDate | date:'MMMM d, y' }}
                    </div>
                    <div class="flex items-center gap-2 mb-4">
                        <span class="text-[10px] font-black uppercase text-emerald-500 tracking-[0.2em]">
                            Article
                        </span>
                    </div>
                    <h4 class="text-xl font-black text-white group-hover:text-emerald-400 leading-tight mb-4">
                        {{ news.title }}
                    </h4>
                    <p class="text-sm text-slate-400 line-clamp-4 leading-relaxed font-medium mb-6">
                        {{ news.description }}
                    </p>
                    <div class="mt-auto pt-6 border-t border-white/5 flex items-center justify-between">
                        <div class="flex items-center gap-2 text-xs font-bold text-emerald-500 group-hover:translate-x-1 transition-transform">
                            Read Full Report
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </a>
            }
        </div>
    </div>
    <div class="mt-auto p-4 border-t border-white/5 bg-black/20 text-center">
        <p class="text-[9px] text-slate-600 font-bold uppercase tracking-widest italic mb-0">
            Market News provided by mtgstocks.com
        </p>
    </div>
</div>
