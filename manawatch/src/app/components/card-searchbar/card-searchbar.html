
  <div class="bg-[#16161a] p-2 rounded-2xl border border-white/5 shadow-2xl mb-8" #searchContainer>
    <div class="flex items-center bg-white/5 rounded-xl group focus-within:ring-2 ring-indigo-500/50 transition-all">
      <div class="pl-5 text-slate-500">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <input 
        [formControl]="searchControl"
        type="text" 
        placeholder="Search cards for market analysis..."
        class="w-full bg-transparent border-none py-5 px-5 text-white placeholder:text-slate-600 focus:outline-none font-medium text-lg"
        (keydown.enter)="executeSearch(searchControl.value?.toString() || '')"
      />
      @if (isLoading()) {
        <div class="pr-5">
          <div class="w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
      }
    </div>


     @if (suggestions().length > 0 && showSuggestions()) {
    <div class="absolute left-0 right-0 mt-2 bg-[#1c1c22] border border-white/10 rounded-xl shadow-2xl z-50 overflow-hidden divide-y divide-white/5 mx-2 max-w-6xl mx-auto">
      @for (s of suggestions(); track $index) {
        <button 
          class="w-full text-left px-6 py-4 hover:bg-indigo-600/10 text-slate-300 hover:text-white transition-colors text-sm font-semibold flex items-center justify-between"
          (click)="executeSearch(s)"
        >
          {{ s }}
          <span class="text-[10px] text-indigo-500 font-black uppercase italic">Select</span>
        </button>
      }
    </div>
    }
  </div>
