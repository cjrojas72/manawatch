<div class="min-h-screen bg-[#0d0d10] text-slate-200 font-sans p-4 md:p-8">
    <header>
        <app-header></app-header>
    </header>
    <main class="max-w-7xl mx-auto">
        <section id="search-section" class="mb-12">
            <app-card-searchbar></app-card-searchbar>
        </section>
        <section id="tab-section">
            <div id="tab-div" class="flex justify-end mb-12">
                <div  id="tab-controls" class="flex gap-1 bg-white/5 p-1 rounded-xl border border-white/10">
                    <button 
                    (click)="selectTab('portfolio')"
                    [class.bg-indigo-600]="activeTab() === 'portfolio'"
                    [class.text-white]="activeTab() === 'portfolio'"
                    class="px-6 py-2 rounded-lg text-xs font-bold uppercase tracking-widest transition-all cursor-pointer">
                    Portfolio
                    </button>
                    <button 
                    (click)="selectTab('market')"
                    [class.bg-indigo-600]="activeTab() === 'market'"
                    [class.text-white]="activeTab() === 'market'"
                    class="px-6 py-2 rounded-lg text-xs font-bold uppercase tracking-widest transition-all cursor-pointer">
                    Market
                    </button>
                </div>
            </div>
            
            <section id="portfolio-section" [hidden]="activeTab() !== 'portfolio'">
                <app-watchlist-page></app-watchlist-page>
            </section>

            <section id="market-section"  [hidden]="activeTab() !== 'market'">
                <app-search-results></app-search-results>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-in mt-5">
                        <app-topten-list></app-topten-list>
                        <app-trending-list></app-trending-list>
                    </div>
            </section>
        </section>
    </main>
</div>
