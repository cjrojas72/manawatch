<app-search-results></app-search-results>
@switch (pageMode()) {
    @case ("dash") {
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-in mt-5">
            <app-topten-list></app-topten-list>
            <app-trending-list></app-trending-list>
        </div>
    }
    @case ("details") {
        <div class="my-3">
            <button
                (click)="onBackBtnSelect()" 
                class="px-6 py-3 text-xs text-white uppercase tracking-widest hover:bg-amber-500 shadow-amber-900/20 transition-all active:scale-95">&larr; Back to dashboard</button>
        </div>
        <app-card-detail-page [cardId]="cardId()"></app-card-detail-page>
    }
}
