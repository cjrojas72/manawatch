<div class="relative">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-8">
            <app-price-chart mode="watchlist"></app-price-chart>
            <div class="p-6 bg-white/[0.01] border border-white/5 rounded-2xl text-center mt-5">
                <p class="text-[10px] text-slate-600 font-black uppercase tracking-[0.4em] italic"> 
                Valuations sourced via MTGJSON and TCGPlayer 
                </p>
            </div>
        </div>
        <div class="lg:col-span-4">
            <app-watchlist-list></app-watchlist-list>
        </div>
    </div>  
        @if (!isAuth()) {
            <div class="absolute inset-0 z-20 bg-black/40 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center border border-white/10 p-8 text-center animate-fade-in shadow-inner">
                <div class="w-16 h-16 bg-indigo-600/20 rounded-2xl flex items-center justify-center text-indigo-400 mb-5 border border-indigo-500/30 shadow-xl">
                   <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h3 class="text-xl font-black text-white uppercase italic tracking-tighter mb-2">Locked</h3>
                <p class="text-slate-400 text-[11px] max-w-[240px] mb-6 font-bold uppercase tracking-widest leading-relaxed">Sign in to start tracking!</p>
                <button (click)="openAuthModal()" class="px-8 py-4 bg-white text-black text-[10px] font-black uppercase tracking-[0.2em] rounded-xl shadow-xl transition-all active:scale-95 hover:bg-indigo-500 hover:text-white cursor-pointer">
                    Sign In
                </button>
            </div>
        }
</div>
